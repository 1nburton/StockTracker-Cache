name: Rebuild fundamentals cache

on:
  schedule:
    - cron: '0 2 * * 0'  # 2 AM UTC every Sunday
  workflow_dispatch:       # manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build fundamentals cache
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY_1 }}
        run: node scripts/build-cache.js

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add fundamentals.json
          git diff --staged --quiet && echo "No changes" || git commit -m "Update fundamentals cache $(date -u +%Y-%m-%d)"
          git push
